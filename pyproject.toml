[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cupbearer"
version = "0.1.0"
description = "Two-Sprite zero-secret file detonation and invoice-trust agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10.4,<12"
]

[project.optional-dependencies]
airlock = ["playwright>=1.45,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[project.scripts]
cupbearer-airlock = "cupbearer.airlock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cupbearer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
